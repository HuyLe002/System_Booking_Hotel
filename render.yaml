services:
  - type: web
    name: hotel-booking-api
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./HotelBookingAPI/Dockerfile
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:10000
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Key
        sync: false
      - key: BootstrapAdmin__Username
        sync: false
      - key: BootstrapAdmin__Password
        sync: false
      - key: Cors__AllowedOrigins__0
        sync: false
