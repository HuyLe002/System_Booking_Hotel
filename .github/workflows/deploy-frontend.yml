name: Deploy frontend to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "HotelBookingAPI/Đặt phòng và quản lý khách sạn/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: "HotelBookingAPI/Đặt phòng và quản lý khách sạn/pnpm-lock.yaml"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: "HotelBookingAPI/Đặt phòng và quản lý khách sạn"

      - name: Build frontend
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "::warning::VITE_API_BASE_URL repository variable is not configured. API-backed features will not work until it is set."
          fi
          pnpm build
        working-directory: "HotelBookingAPI/Đặt phòng và quản lý khách sạn"
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_BASE_PATH: /System_Booking_Hotel/

      - name: Add static route fallback
        run: cp dist/index.html dist/404.html
        working-directory: "HotelBookingAPI/Đặt phòng và quản lý khách sạn"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "HotelBookingAPI/Đặt phòng và quản lý khách sạn/dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
